<!--

iQuestion - iLM (Interactive Learning Module) de pergunta de múltipla escolha
para o iAssign.

Modo professor (autoria): escreve o enunciado, adiciona alternativas e marca
qual delas é a correta.
Modo aluno: lê o enunciado e escolhe uma alternativa.

Uso local (fora do Moodle), só para testar a interface:
  index.html                          -> modo aluno, sem gabarito
  index.html?iLM_PARAM_Authoring=true -> modo professor (montar a pergunta)

Uso dentro do iAssign: o próprio iAssign monta a URL com os parâmetros
iLM_PARAM_* (veja integration-functions.js) e carrega esta página num <iframe>.

-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>iQuestion</title>
  <link rel="stylesheet" href="ilm_style.css" />
</head>

<body onload="start_iLM();">

  <div id="ilm-container">

    <!-- Modo aluno: enunciado exibido aqui -->
    <div id="enunciado" class="ilm-enunciado"></div>

    <!-- Modo aluno: alternativas para escolher -->
    <div id="area-aluno" style="display:none;">
      <div id="alternativas-aluno" class="ilm-alternativas"></div>
    </div>

    <!-- Modo professor (autoria): campos para montar a pergunta -->
    <div id="area-professor" style="display:none;">
      <label for="autoria-enunciado">Enunciado da pergunta:</label>
      <textarea id="autoria-enunciado" rows="3" style="width:100%;"></textarea>

      <p class="ilm-dica">Marque com o botão à esquerda de cada alternativa qual delas é a correta.</p>
      <div id="lista-alternativas-professor" class="ilm-lista-alternativas-professor"></div>

      <button type="button" id="btn-add-alternativa" onclick="adicionarAlternativaProfessor();">+ Adicionar alternativa</button>
    </div>

  </div>

  <!-- Ordem importa: seu código primeiro, depois o integrador -->
  <script src="iquestion.js"></script>
  <script src="integration-functions.js"></script>

</body>
</html>
